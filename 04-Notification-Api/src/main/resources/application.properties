spring.application.name=04-Notification-Api

server.port=${PORT:9093}

spring.main.allow-circular-references=true
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ecommerce?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:${TRUSTSTORE_PATH}&trustCertificateKeyStorePassword=changeit&trustCertificateKeyStoreType=JKS&fallbackToSystemTrustStore=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

