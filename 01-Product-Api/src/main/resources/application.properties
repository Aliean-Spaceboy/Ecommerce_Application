spring.application.name=Product_Api
server.port=${PORT:9090}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ecommerce?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:${TRUSTSTORE_PATH}&trustCertificateKeyStorePassword=changeit&trustCertificateKeyStoreType=JKS&fallbackToSystemTrustStore=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.boot.admin.client.url=http://localhost:1111
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
management.endpoints.web.exposure.include=*
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
