spring.application.name=Customer_Api
server.port=${PORT:9091}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ecommerce?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:${TRUSTSTORE_PATH}&trustCertificateKeyStorePassword=changeit&trustCertificateKeyStoreType=JKS&fallbackToSystemTrustStore=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.boot.admin.client.enabled=false
eureka.client.enabled=false
management.endpoints.web.exposure.include=*
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
jwt.secret=${JWT_SECRET}
